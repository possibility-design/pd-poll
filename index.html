<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>地域展開アンケート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap">
<style>
/* PDホームページの配色：紺・青・シアン・金。スライドと同じ白→マリンブルーのグラデーション */
:root{
  --ink:#0F172A; --sub:#475569; --muted:#64748B; --line:#E2E8F0;
  --blue:#0052D4; --blue2:#2F86F0; --cyan:#00C6FF; --gold:#D4AF37; --goldtxt:#8A6318; --goldsoft:#F6EFDA;
  --soft:#E8F0FC; --neg:#E0583F; --negtxt:#B5361F; --negsoft:#FCE9E4; --ok:#13704F;
  --card:#FFFFFF;
  --bg:linear-gradient(160deg,#FFFFFF 0%,#F2F8FD 45%,#CFE6F7 100%);
  --font:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:var(--font);color:var(--ink);background:#F2F8FD;background-image:var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
[hidden]{display:none!important}
.mark{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:3px;color:var(--ink)}
.mark b{color:var(--gold);font-weight:800}

/* ---------- スマホの回答ページ ---------- */
.phone{display:flex;flex-direction:column;gap:22px;max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 150px) max(16px,env(safe-area-inset-left,0px))}
.phone .mark{font-size:13px}
.intro{display:flex;flex-direction:column;gap:10px}
.intro h1{font-size:24px;font-weight:900;line-height:1.45;text-wrap:balance}
.intro p{font-size:15px;color:var(--sub);line-height:1.7}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 20px rgba(15,23,42,.05)}
.q .no{font-size:13px;font-weight:800;color:var(--blue);letter-spacing:2px;display:flex;align-items:center;gap:8px}
.q .no:before{content:"";width:22px;height:3px;background:var(--gold)}
.q h2{font-size:19px;font-weight:800;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{flex-direction:row}
.opts.two .opt{flex:1;justify-content:center;font-size:20px;padding:20px 8px;font-weight:900}
.opt{appearance:none;display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:#F8FAFC;color:var(--ink);
  border-radius:10px;padding:13px 14px;font-size:16px;font-weight:700;line-height:1.4;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.opt:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid #94A3B8;flex-shrink:0}
.opts.two .opt .dot{display:none}
.opt.on{border-color:var(--blue);background:var(--soft);color:var(--blue)}
.opts.multi .opt .dot{border-radius:5px}
.q .hint{font-size:14px;font-weight:700;color:var(--blue);margin:-4px 0 10px}
.opt.on .dot{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 4px #fff}
.opt.pos{color:var(--blue)}
.opt.pos.on{background:var(--blue);color:#fff}
.opt.neg{color:var(--negtxt)}
.opt.neg.on{border-color:var(--neg);background:var(--neg);color:#fff}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock .msg{font-size:14px;line-height:1.5;color:var(--sub);min-height:21px}
.dock .msg.ok{color:var(--ok);font-weight:700}
.dock .msg.err{color:var(--negtxt);font-weight:700}
.send{appearance:none;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:18px;font-weight:900;padding:16px;cursor:pointer}
.send:disabled{background:#94A3B8;cursor:default}
.send:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* ---------- スクリーンの結果画面（1920×1080 を画面に合わせて拡大縮小） ---------- */
.stage-wrap{position:fixed;inset:0;overflow:hidden;background:#DCEBF7}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background-image:var(--bg);overflow:hidden}
.stage .topbar{position:absolute;left:0;top:0;width:1920px;height:8px;background:linear-gradient(90deg,var(--blue) 0%,var(--cyan) 70%,var(--gold) 100%)}
.stage .brand{position:absolute;right:128px;top:44px;font-size:24px}
.stage .main{position:absolute;left:128px;top:120px;width:1664px;display:flex;flex-direction:column;gap:24px}
.stage.withqr .main{width:1080px}
.stage .eb{display:flex;align-items:center;gap:16px;font-size:28px;font-weight:700;color:var(--blue);letter-spacing:4px}
.stage .eb:before{content:"";width:48px;height:4px;background:var(--gold)}
.stage h1{font-size:64px;font-weight:900;line-height:1.3;text-wrap:balance}
.bars{display:flex;flex-direction:column;gap:22px;margin-top:20px}
.stage.two .bars{gap:40px;margin-top:36px}
.brow{display:grid;grid-template-columns:600px 1fr 240px;align-items:center;column-gap:28px;row-gap:10px}
.stage.withqr .brow{grid-template-columns:1fr 240px}
.stage.withqr .brow .name{grid-column:1 / 3}
.brow .name{font-size:40px;font-weight:900;line-height:1.25;display:flex;align-items:center;gap:16px}
.stage.two .brow .name{font-size:56px}
.brow .top{font-size:22px;font-weight:800;color:var(--goldtxt);background:var(--goldsoft);padding:4px 14px;border-radius:6px;letter-spacing:1px;opacity:0;transform:translateY(6px);transition:opacity .4s 2.2s,transform .4s 2.2s;white-space:nowrap}
.brow.lead .top{opacity:1;transform:none}
.track{position:relative;height:64px;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage.two .track{height:80px}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;background:linear-gradient(90deg,#7FA9E8,#A9C6F0);transition:width 1.6s cubic-bezier(.2,.8,.2,1),background .4s}
.brow.lead .fill{background:linear-gradient(90deg,var(--blue),var(--blue2))}
.brow.c-pos .name{color:var(--blue)} .brow.c-pos .fill{background:linear-gradient(90deg,var(--blue),var(--blue2))}
.brow.c-neg .name{color:var(--negtxt)} .brow.c-neg .fill{background:linear-gradient(90deg,var(--neg),#EE8A72)}
.brow .num{font-size:48px;font-weight:900;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.brow .num small{font-size:28px;font-weight:700;color:var(--muted);margin-left:10px}
.total{display:flex;align-items:baseline;gap:16px;margin-top:12px;font-size:32px;font-weight:700;color:var(--sub)}
.total .n{font-size:56px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;display:inline-block}
.total .n.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18);color:var(--blue)}100%{transform:scale(1)}}
.empty{font-size:32px;color:var(--muted);font-weight:700}
.side{position:absolute;right:128px;top:200px;width:520px;display:flex;flex-direction:column;align-items:center;gap:22px;background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:40px;box-shadow:0 4px 20px rgba(15,23,42,.06)}
.side .qr{width:400px;height:400px}
.side .qr svg{width:100%;height:100%;display:block}
.side .how{font-size:32px;font-weight:900;text-align:center;line-height:1.45}
.side .url{font-size:17px;color:var(--muted);white-space:nowrap;text-align:center}
.conn{position:absolute;left:128px;bottom:52px;display:flex;align-items:center;gap:12px;font-size:22px;color:var(--muted)}
.conn i{width:14px;height:14px;border-radius:50%;background:#94A3B8}
.conn.live i{background:#1F9D74;box-shadow:0 0 0 6px rgba(31,157,116,.18)}
.conn.bad i{background:var(--neg)}
.testtag{position:absolute;left:128px;top:40px;font-size:22px;font-weight:800;color:#fff;background:var(--goldtxt);padding:6px 16px;border-radius:6px;letter-spacing:2px}
.tools{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;opacity:.25;transition:opacity .2s}
.tools:hover,.tools:focus-within{opacity:1}
.tools button{font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.main{position:relative}
.go{position:absolute;left:50%;top:520px;transform:translate(-50%,-50%);font:inherit;font-size:44px;font-weight:800;letter-spacing:2px;color:#fff;background:linear-gradient(135deg,#0052D4,#00A3E0);border:0;border-radius:999px;padding:30px 72px;cursor:pointer;box-shadow:0 18px 40px rgba(0,82,212,.32);z-index:5;transition:opacity .35s,transform .35s}
.go:hover{transform:translate(-50%,-50%) scale(1.04)}
.go.gone{opacity:0;transform:translate(-50%,-50%) scale(.9);pointer-events:none}
.go small{display:block;font-size:20px;font-weight:600;opacity:.85;margin-top:6px;letter-spacing:1px}
</style>
</head>
<body>

<!-- スマホ -->
<main class="phone" id="phone" hidden>
  <div class="mark">POSSIBILITY <b>DESIGN</b></div>
  <div class="intro">
    <h1>吹奏楽の地域展開がもたらすものとは</h1>
    <p id="lead"></p>
  </div>
  <div id="qs" style="display:flex;flex-direction:column;gap:16px"></div>
  <div class="dock"><div class="in">
    <p class="msg" id="msg"></p>
    <button class="send" id="send" type="button" disabled>送信する</button>
  </div></div>
</main>

<!-- スクリーン -->
<div class="stage-wrap" id="screen" hidden>
  <div class="stage" id="stage">
    <div class="topbar"></div>
    <p class="testtag" id="testTag" hidden>練習用</p>
    <div class="brand mark">POSSIBILITY <b>DESIGN</b></div>
    <div class="main">
      <p class="eb">みんなの回答</p>
      <h1 id="sTitle"></h1>
      <div class="bars" id="bars"></div>
      <p class="empty" id="empty" hidden>まだ回答がありません</p>
      <p class="total">回答 <span class="n" id="nAll">0</span>人</p>
      <button type="button" class="go" id="go">結果を見る ▶<small>クリック、またはスペースキー</small></button>
    </div>
    <div class="side" id="side" hidden>
      <div class="qr" id="qr" aria-label="回答ページのQRコード"></div>
      <p class="how">スマホのカメラで<br>読み取ってください</p>
      <p class="url" id="url"></p>
    </div>
    <p class="conn" id="conn"><i></i><span id="connT">接続しています…</span></p>
  </div>
  <div class="tools"><button type="button" id="btnFull">全画面（F）</button><button type="button" id="btnZero">表示をゼロに戻す</button></div>
</div>
